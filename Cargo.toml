[package]
name = "web_app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
serde_json = "1.0.143"

[dependencies]
leptos = { version = "0.8.6", features = ["csr"] }
leptos_meta = "0.8.5"
web-sys = "0.3.77"
gloo-net = { version = "0.6.0", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
